<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="350" height="200" role="img" aria-label="CleanGit project">
  <defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#0BD400" stroke-opacity=".05"/></pattern></defs>
  <rect width="350" height="200" rx="14" fill="#050505"/>
  <rect width="350" height="200" rx="14" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="349" height="199" rx="14" fill="none" stroke="#0BD400" stroke-opacity=".25"/>
<text x="28" y="40" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#0BD400" fill-opacity=".8">// project</text>
  <path d="M304 34 l14 -14 m-9 0 h9 v9" fill="none" stroke="#0BD400" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="28" y="74" font-family="Poppins,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#F0F0F0">CleanGit</text>
  <text x="28" y="104" font-family="Poppins,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#aaaaaa">Chrome extension to manage GitHub</text>
  <text x="28" y="125" font-family="Poppins,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#aaaaaa">repos in bulk: analyze, archive,</text>
  <text x="28" y="146" font-family="Poppins,'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#aaaaaa">change visibility or delete.</text>
  <rect x="28" y="156" width="137" height="24" rx="6" fill="#0a0f0a" stroke="#0BD400" stroke-opacity=".32"/><text x="39" y="172" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#F0F0F0" textLength="115" lengthAdjust="spacing">Chrome Extension</text>
  <rect x="173" y="156" width="58" height="24" rx="6" fill="#0a0f0a" stroke="#0BD400" stroke-opacity=".32"/><text x="184" y="172" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#F0F0F0" textLength="36" lengthAdjust="spacing">React</text>
