  <text x="48" y="260" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17"><tspan fill="#d4d4d4">data in </tspan><tspan fill="#0BD400" font-weight="700">MySQL</tspan><tspan fill="#d4d4d4">. Now learning to bring </tspan><tspan fill="#0BD400" font-weight="700">generative AI</tspan><tspan fill="#d4d4d4"> into real products.</tspan></text>
  <text x="48" y="304" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17"><tspan fill="#0BD400">marcus@dev</tspan><tspan fill="#7a7a7a">:~$ </tspan><tspan fill="#F0F0F0"></tspan></text>
