  <text x="48" y="204" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="17"><tspan fill="#d4d4d4">I build </tspan><tspan fill="#0BD400" font-weight="700">web systems</tspan><tspan fill="#d4d4d4"> and business software, end to end:</tspan></text>
