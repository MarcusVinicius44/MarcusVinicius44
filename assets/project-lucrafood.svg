  <rect x="28" y="156" width="101" height="24" rx="6" fill="#0a0f0a" stroke="#0BD400" stroke-opacity=".32"/><text x="39" y="172" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#F0F0F0" textLength="79" lengthAdjust="spacing">Django REST</text>
